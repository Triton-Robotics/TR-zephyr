# SWO
# For Ozone itself makesure to right click on terminal and click "Capture SWO" or else nothing will output on the terminal!
CONFIG_LOG=y
# Must be on for SWO, printk and LOG
CONFIG_LOG_BACKEND_SWO=y

# Bypasses buffer, outputs immediately
CONFIG_LOG_MODE_IMMEDIATE=y

# Must match setting within Ozone. THIS DOESNT CHANGE matches the nucleo. Tools -> Trace -> CPU Frequency
CONFIG_LOG_BACKEND_SWO_REF_FREQ_HZ=96000000
# Must match setting within Ozone. Tools -> Trace Settings -> SWO Frequency
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=1500000