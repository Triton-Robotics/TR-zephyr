CONFIG_LOG=y
CONFIG_LOG_BACKEND_SWO=y
# SWO baud rate; set the same value in Ozone / SWO viewer
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=2000000
# must match the core clock, 84 mhz
CONFIG_LOG_BACKEND_SWO_REF_FREQ_HZ=84000000
# printk goes through logging, so to SWO
CONFIG_LOG_PRINTK=y
# no logs on UART
CONFIG_LOG_BACKEND_UART=n
# console stops using USART2
CONFIG_UART_CONSOLE=n
# print right away instead of waiting for the log thread
CONFIG_LOG_MODE_IMMEDIATE=y