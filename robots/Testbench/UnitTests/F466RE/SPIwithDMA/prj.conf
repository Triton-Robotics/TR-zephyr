# enable GPIO subsystem
CONFIG_GPIO=y

# C++ config
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# CAN
CONFIG_CAN=y

#I2C
CONFIG_I2C=y

#SPI
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_SPI_STM32_DMA=y

#PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

#Power Management
CONFIG_PM=y
CONFIG_PM_DEVICE=y

#Asserts
CONFIG_ASSERT=y

# UART 
CONFIG_SERIAL=y
#CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_DMA=y
CONFIG_UART_ASYNC_API=y


# DEBUG
# CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y