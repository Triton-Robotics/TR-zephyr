CONFIG_MAIN_STACK_SIZE=8192

# enable GPIO subsystem
CONFIG_GPIO=y

# SWO logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SWO=y
# Logs go to SWO only, not the console UART, will not show in serial monitor
CONFIG_LOG_BACKEND_UART=n
# Route printk through logging (and so to SWO)
CONFIG_LOG_PRINTK=y
# Don't block the 500 Hz control loop
CONFIG_LOG_MODE_DEFERRED=y
# 1.5 MHz, must match the SWO setting in Ozone
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=1500000
# Needed for %f in LOG_* and printk
CONFIG_CBPRINTF_FP_SUPPORT=y

# C++ config
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# CAN
CONFIG_CAN=y

# UART
CONFIG_SERIAL=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
# CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_ISM330DHCX=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y
CONFIG_PWM_LOG_LEVEL_DBG=y


# Power Management
CONFIG_PM=n
CONFIG_PM_DEVICE=y

# Asserts
CONFIG_ASSERT=y

CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# CONFIG_THREAD_STACK_INFO=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# These will flood your log output with messages. Be aware.
CONFIG_I2C_LOG_LEVEL_ERR=n
CONFIG_CAN_LOG_LEVEL_DBG=n

# CONFIG_SHELL=y
CONFIG_UART_LINE_CTRL=y

CONFIG_HEAP_MEM_POOL_SIZE=8192