CONFIG_MAIN_STACK_SIZE=8192

# enable GPIO subsystem
CONFIG_GPIO=y

# SWO
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SWO=y
# SWO baud rate; set the same value in Ozone / SWO viewer
CONFIG_LOG_BACKEND_SWO_FREQ_HZ=1500000
# must match the core clock (CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC in build/Testbench/zephyr/.config)
CONFIG_LOG_BACKEND_SWO_REF_FREQ_HZ=96000000
# printk goes through logging, so to SWO
CONFIG_LOG_PRINTK=y
# no logs on UART
CONFIG_LOG_BACKEND_UART=n
# console stops using USART2
CONFIG_UART_CONSOLE=n
# print right away instead of waiting for the log thread
CONFIG_LOG_MODE_IMMEDIATE=y

# C++ config
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# CAN
CONFIG_CAN=y

# UART
CONFIG_SERIAL=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
# CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_ISM330DHCX=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

# Power Management
CONFIG_PM=n
CONFIG_PM_DEVICE=y

# Asserts
CONFIG_ASSERT=y

CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y

# CONFIG_THREAD_STACK_INFO=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# These will flood your log output with messages. Be aware.
CONFIG_I2C_LOG_LEVEL_ERR=n
CONFIG_CAN_LOG_LEVEL_DBG=n

# CONFIG_SHELL=y
CONFIG_UART_LINE_CTRL=y

CONFIG_HEAP_MEM_POOL_SIZE=8192